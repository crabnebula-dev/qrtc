[package]
name = "qrtc"
description = "Quantum realtime communication: a pure Rust WebRTC engine (JSEP, ICE, STUN/TURN, data channels, media) over str0m, with hybrid post-quantum key agreement"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.91"
repository = "https://github.com/crabnebula-dev/qrtc"
keywords = ["webrtc", "post-quantum", "ml-kem", "dtls", "turn"]
categories = ["network-programming", "multimedia", "cryptography"]
exclude = ["tests/"]

# The vendored crates are path dependencies, not workspace members: their
# default features (aws-lc-rs) stay out of the resolve and the SBOM.
[workspace]
exclude = ["vendor"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
# Vendored 0.24.0 with small patches; see vendor/str0m/PATCHES.md. str0m's
# own dependencies on dimpl, str0m-proto and is point into vendor/ too.
str0m = { path = "vendor/str0m", version = "0.24", default-features = false, features = ["rust-crypto"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
if-addrs = "0.13"
rand = "0.9"
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
crc32fast = "1"
tracing = { version = "0.1", features = ["log"] }
rusty-opus = "0.9"
sonora = "0.2"
socket2 = { version = "0.6", features = ["all"] }
# TURN over TLS (turns:). The crypto provider is chosen by feature.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, optional = true }
rustls-native-certs = { version = "0.8", optional = true }
webpki-roots = { version = "1", optional = true }
rustls-rustcrypto = { version = "0.0.2-alpha", optional = true }
# Post-quantum key agreement (features pq-hybrid, pq-moduletto).
dimpl = { path = "vendor/dimpl", version = "0.7.4", default-features = false, features = ["rust-crypto"], optional = true }
str0m-rust-crypto = { path = "vendor/str0m-rust-crypto", version = "0.6", optional = true }
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"], optional = true }
x25519-dalek = { version = "2", features = ["static_secrets"], optional = true }
getrandom = { version = "0.3", optional = true }
zeroize = { version = "1", optional = true }
# ML-KEM-512 and ML-KEM-768 (FIPS 203) from moduletto, MIT OR Apache-2.0.
moduletto = { git = "https://github.com/crabnebula-dev/moduletto", branch = "main", optional = true }

[features]
default = ["turn-tls-ring", "pq-moduletto"]
# ring: mature, compiles C and assembly.
turn-tls-ring = ["_turn-tls", "rustls/ring", "tokio-rustls/ring"]
# Pure Rust (RustCrypto). Pre-release provider; keeps the build free of C.
turn-tls-rustcrypto = ["_turn-tls", "dep:rustls-rustcrypto"]
_turn-tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-native-certs", "dep:webpki-roots"]
# Post-quantum key agreement for DTLS 1.3 and TURN over TLS: X25519MLKEM768
# (what browsers and TLS servers negotiate) and MLKEM768. Set per connection
# with RtcConfiguration.postQuantum (default prefer when built in). Two ML-KEM
# backends, both pure Rust; pq-moduletto is on by default. For RustCrypto
# instead: default-features = false, features = ["pq-hybrid", ...].
# RustCrypto ml-kem.
pq-hybrid = ["_pq", "dep:ml-kem"]
# moduletto (NEON on aarch64). Also adds ML-KEM-512 and an X25519+ML-KEM-512
# hybrid on a private codepoint, which only this engine speaks. Takes
# precedence over ml-kem when both features are on.
pq-moduletto = ["_pq", "dep:moduletto"]
_pq = ["dep:dimpl", "dep:str0m-rust-crypto", "dep:x25519-dalek", "dep:getrandom", "dep:zeroize"]

[dev-dependencies]
env_logger = "0.11"
