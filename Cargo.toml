[package]
name = "tauri-webrtc-engine"
description = "Pure Rust WebRTC engine for tauri-plugin-webrtc: JSEP, ICE gathering, STUN/TURN, data channels and media over str0m"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
if-addrs = "0.13"
rand = "0.9"
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
crc32fast = "1"
tracing = { version = "0.1", features = ["log"] }
rusty-opus = "0.9"
sonora = "0.2"
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
env_logger = "0.11"
